{% extends "base.html" %}
{% block title %}Настройки — MetaGatherer{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-4">Настройки</h1>

<div class="card">
  <form method="post" action="/settings">
    <label class="block text-sm font-medium text-gray-700 mb-2">Отображаемое имя</label>
    <input class="input mb-1" type="text" name="display_name"
           value="{{ user.display_name or (user.first_name or '') + (' ' + user.last_name if user.last_name else '') }}"
           placeholder="Имя Фамилия" required>
    <p class="text-xs text-gray-400 mb-4">Так вас увидят другие участники</p>
    {% if user.email %}
    <p class="text-sm text-gray-500 mb-4">Email: {{ user.email }}</p>
    {% endif %}
    <button class="btn btn-primary" type="submit">Сохранить</button>
  </form>
</div>
{% endblock %}
