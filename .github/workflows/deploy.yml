name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PROD
    runs-on: ubuntu-latest
    # Deploys are paused while the data-center VM is unavailable.
    if: vars.DEPLOY_ENABLED == 'true'
    timeout-minutes: 25
    concurrency:
      group: metagatherer-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          bash bot/setup_ssh_known_hosts.sh
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Write prod .env
        run: echo "${{ secrets.ENV_FILE }}" > bot/.env

      - name: Deploy production
        run: bash bot/deploy_bot.sh
        env:
          SSH_KEY: ~/.ssh/deploy_key
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
