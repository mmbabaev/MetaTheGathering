name: PR — Tests & Debug Deploy

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Check single alembic head
        run: |
          COUNT=$(python -m alembic heads 2>/dev/null | grep -c "(head)" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected 1 alembic head, got $COUNT. Fix down_revision in your migration."
            python -m alembic heads
            exit 1
          fi
        env:
          TELEGRAM_BOT_TOKEN: "0000000000:test_token_for_ci"
          DATABASE_URL: "sqlite:///:memory:"

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/e2e --ignore=tests/telegram_e2e
        env:
          TELEGRAM_BOT_TOKEN: "0000000000:test_token_for_ci"
          DATABASE_URL: "sqlite:///:memory:"

  telegram-e2e:
    name: Telegram integration E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run in-process Telegram flows
        run: |
          started_at=$(date +%s)
          python -m pytest tests/telegram_e2e/ -v --durations=10
          elapsed=$(( $(date +%s) - started_at ))
          echo "Telegram E2E test runtime: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
        env:
          TELEGRAM_BOT_TOKEN: "0000000000:test_token_for_ci"
          DATABASE_URL: "sqlite:///:memory:"

  deploy-debug:
    name: Deploy DEBUG
    needs: [test, telegram-e2e]
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: metagatherer-debug-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Write debug .env
        run: echo "${{ secrets.ENV_FILE_DEBUG }}" > bot/.env.debug

      - name: Deploy debug bot
        run: bash bot/deploy_bot_debug.sh
        env:
          SSH_KEY: ~/.ssh/deploy_key
          PREVIEW_ID: ${{ github.event.pull_request.number }}

      - name: Deploy debug web
        run: bash bot/deploy_web_debug.sh
        env:
          SSH_KEY: ~/.ssh/deploy_key
          PREVIEW_ID: ${{ github.event.pull_request.number }}
