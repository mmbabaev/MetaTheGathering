name: Deploy Pauper Sim — Production

on:
  push:
    branches: [main]
    paths:
      - 'pauper_sim/**'
      - 'bot/systemd/pauper-sim.service'
      - 'bot/deploy_pauper_sim.sh'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Pauper Sim PROD
    runs-on: ubuntu-latest
    concurrency:
      group: pauper-sim-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Pauper Sim
        run: bash bot/deploy_pauper_sim.sh
        env:
          SSH_KEY: ~/.ssh/deploy_key