<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243447}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#52616b}.label{font-size:14px;font-weight:600}.small{font-size:12px}.axis{stroke:#8b99a5;stroke-width:1}.grid{stroke:#e4e9ee;stroke-width:1}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="48" y="38" class="title">Кто играет в обоих треках</text>
<text x="48" y="63" class="subtitle">76 уникальных игроков обычного Endstep: временная проверка пересечения с понедельниками «Единорога».</text>
<line x1="82" y1="430.0" x2="1000" y2="430.0" class="grid"/>
<text x="70" y="434.0" text-anchor="end" class="small">0</text>
<line x1="82" y1="370.9" x2="1000" y2="370.9" class="grid"/>
<text x="70" y="374.9" text-anchor="end" class="small">10</text>
<line x1="82" y1="311.8" x2="1000" y2="311.8" class="grid"/>
<text x="70" y="315.8" text-anchor="end" class="small">20</text>
<line x1="82" y1="252.7" x2="1000" y2="252.7" class="grid"/>
<text x="70" y="256.7" text-anchor="end" class="small">30</text>
<line x1="82" y1="193.6" x2="1000" y2="193.6" class="grid"/>
<text x="70" y="197.6" text-anchor="end" class="small">40</text>
<line x1="82" y1="134.5" x2="1000" y2="134.5" class="grid"/>
<text x="70" y="138.5" text-anchor="end" class="small">50</text>
<line x1="82" y1="430" x2="1000" y2="430" class="axis"/>
<line x1="82" y1="105" x2="82" y2="430" class="axis"/>
<rect x="137" y="329.5" width="190" height="100.5" rx="5" fill="#2563eb"/>
<text x="232.0" y="319.5" text-anchor="middle" font-size="24" font-weight="700">17</text>
<text x="232.0" y="458" text-anchor="middle" class="small">Продолжили</text>
<text x="232.0" y="475" text-anchor="middle" class="small">играть в</text>
<text x="232.0" y="492" text-anchor="middle" class="small">«Единороге»</text>
<rect x="412" y="365.0" width="190" height="65.0" rx="5" fill="#f59e0b"/>
<text x="507.0" y="355.0" text-anchor="middle" font-size="24" font-weight="700">11</text>
<text x="507.0" y="458" text-anchor="middle" class="small">Кандидаты</text>
<text x="507.0" y="475" text-anchor="middle" class="small">на</text>
<text x="507.0" y="492" text-anchor="middle" class="small">переключение</text>
<rect x="687" y="146.4" width="190" height="283.6" rx="5" fill="#94a3b8"/>
<text x="782.0" y="136.4" text-anchor="middle" font-size="24" font-weight="700">48</text>
<text x="782.0" y="458" text-anchor="middle" class="small">Не были в</text>
<text x="782.0" y="475" text-anchor="middle" class="small">«Единороге»</text>
<text x="782.0" y="492" text-anchor="middle" class="small">до Endstep</text>
<rect x="82" y="535" width="886" height="70" rx="8" fill="#f8fafc" stroke="#dbe3ea"/>
<text x="105" y="562" class="label">Основной ответ:</text>
<text x="250" y="562" class="subtitle">28 из 76 (36,8%) когда-либо были в «Единороге».</text>
<text x="105" y="588" class="subtitle">Чувствительность по заполненному городу не публикуется на уровне игроков.</text>
</svg>
